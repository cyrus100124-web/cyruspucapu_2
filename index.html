<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3">
  <meta name="description" content="一個可自訂選項、適合手機使用的可愛馬卡龍大轉盤。">
  <title>馬卡龍大轉盤｜隨機選一個</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #51404e;
      --muted: #9a8794;
      --pink: #e987aa;
      --pink-dark: #cf688f;
      --cream: #fffaf5;
      --card: rgba(255, 255, 255, .82);
      --line: rgba(154, 110, 133, .15);
      --shadow: 0 22px 65px rgba(130, 92, 110, .12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 8% 5%, rgba(255, 205, 218, .7), transparent 31rem),
        radial-gradient(ellipse at 95% 24%, rgba(205, 231, 224, .7), transparent 30rem),
        radial-gradient(ellipse at 62% 100%, rgba(229, 216, 248, .58), transparent 35rem),
        #fff8f3;
    }
    button, textarea { font: inherit; }
    button { touch-action: manipulation; }
    .page { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 52px; height: 52px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.9); border-radius: 18px;
      color: #fff; font-size: 27px;
      background: linear-gradient(145deg, #f7b6cb, #d9b8ec);
      box-shadow: 0 9px 24px rgba(218, 151, 182, .28);
    }
    .eyebrow { margin: 0 0 4px; color: var(--pink-dark); font-size: 11px; font-weight: 850; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: .035em; }
    .header-note { color: var(--muted); font-size: 13px; text-align: right; line-height: 1.7; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(310px, .85fr); gap: 22px; align-items: stretch; }
    .card {
      border: 1px solid rgba(255,255,255,.92); border-radius: 27px;
      background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    .wheel-card { min-height: 650px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 28px 24px; overflow: hidden; }
    .wheel-heading { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
    .wheel-heading h2, .section-heading h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .count-pill {
      padding: 7px 11px; border: 1px solid rgba(213, 145, 174, .22); border-radius: 99px;
      color: #bd6b8d; background: #fff0f5; font-size: 12px; white-space: nowrap;
    }
    .wheel-controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .sound-toggle {
      width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid rgba(213,145,174,.28); border-radius: 50%; color: #8a5c72;
      cursor: pointer; background: rgba(255,255,255,.78); font-size: 17px;
      box-shadow: 0 3px 10px rgba(130,92,110,.08); transition: transform .15s ease, background .15s ease;
    }
    .sound-toggle:hover { transform: scale(1.06); background: #fff; }
    .sound-toggle[aria-pressed="false"] { color: #aa98a2; background: rgba(255,255,255,.48); }
    .wheel-wrap { position: relative; width: min(100%, 560px); aspect-ratio: 1; display: grid; place-items: center; }
    canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 13px 18px rgba(117, 79, 99, .17)); }
    .pointer {
      position: absolute; z-index: 2; top: -1px; left: 50%; width: 0; height: 0; transform: translateX(-50%);
      border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 32px solid #fff;
      filter: drop-shadow(0 4px 4px rgba(97, 70, 88, .2));
    }
    .spin-button {
      position: absolute; z-index: 3; width: 25%; min-width: 105px; aspect-ratio: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 7px solid rgba(255,255,255,.72); border-radius: 50%; color: #fff; cursor: pointer;
      background: linear-gradient(145deg, #f4b1c7, #dc86a9 65%, #ce7ba5);
      box-shadow: 0 10px 26px rgba(204, 113, 151, .3), inset 0 2px 5px rgba(255,255,255,.45);
      transition: transform .18s ease, filter .18s ease;
    }
    .spin-button:hover:not(:disabled) { transform: scale(1.045); filter: brightness(1.04); }
    .spin-button:active:not(:disabled) { transform: scale(.98); }
    .spin-button:disabled { cursor: not-allowed; filter: grayscale(.2); opacity: .72; }
    .spin-button strong { font-size: clamp(17px, 2vw, 22px); letter-spacing: .1em; }
    .spin-button span { margin-top: 3px; font-size: 9px; font-weight: 850; letter-spacing: .18em; opacity: .84; }
    .wheel-caption { margin: 9px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .side { display: flex; flex-direction: column; gap: 17px; }
    .result-card { position: relative; min-height: 205px; padding: 22px 23px 20px; overflow: hidden; }
    .result-card::after {
      content: "✦"; position: absolute; right: 19px; top: 11px; color: rgba(232, 135, 170, .19);
      font-size: 69px; line-height: 1; transform: rotate(12deg); pointer-events: none;
    }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag { color: #c77f9b; font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .winner {
      min-height: 74px; display: flex; align-items: center; margin: 10px 0 3px;
      color: #bd6b8d; font-size: clamp(29px, 4vw, 39px); font-weight: 900; letter-spacing: .025em;
      overflow-wrap: anywhere;
    }
    .result-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .editor-card { padding: 21px 22px 19px; display: flex; flex-direction: column; flex: 1; }
    .editor-intro { margin: 6px 0 13px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .textarea-wrap { position: relative; flex: 1; min-height: 280px; }
    textarea {
      display: block; width: 100%; min-height: 280px; height: 100%; resize: vertical;
      border: 1px solid #f0dce5; border-radius: 16px; padding: 14px 15px;
      outline: none; color: var(--ink); background: rgba(255, 250, 252, .82);
      font-size: 14px; line-height: 1.8; box-shadow: inset 0 2px 5px rgba(145, 101, 123, .035);
    }
    textarea::placeholder { color: #c5b3be; }
    textarea:focus { border-color: #e7a5bd; box-shadow: 0 0 0 4px rgba(232, 135, 170, .11); }
    textarea:disabled { opacity: .7; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .save-status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .save-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #89c9ad; }
    .clear-button {
      min-height: 38px; border: 1px solid #ecdde4; border-radius: 11px; padding: 8px 12px;
      color: #9e7789; cursor: pointer; background: rgba(255,255,255,.72); font-size: 12px;
      transition: background .15s ease, border-color .15s ease;
    }
    .clear-button:hover:not(:disabled) { border-color: #e7b5c7; background: #fff3f7; }
    .clear-button:disabled { cursor: default; opacity: .5; }
    .tip {
      margin-top: 13px; padding: 11px 12px; border-radius: 13px; color: #92778a;
      background: #f7eff7; font-size: 11px; line-height: 1.65;
    }
    button:focus-visible { outline: 3px solid #cf83a1; outline-offset: 3px; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .wheel-card { min-height: auto; }
      .wheel-wrap { width: min(100%, 550px); }
      .side { display: grid; grid-template-columns: .9fr 1.1fr; align-items: stretch; }
      .editor-card { min-height: 455px; }
      .result-card { min-height: 0; }
    }
    @media (max-width: 600px) {
      .page { width: min(100% - 22px, 520px); padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: calc(27px + env(safe-area-inset-bottom)); }
      header { align-items: flex-start; margin-bottom: 17px; }
      .brand { gap: 11px; }
      .brand-mark { width: 45px; height: 45px; border-radius: 15px; font-size: 23px; }
      .header-note { max-width: 96px; font-size: 11px; }
      .layout { gap: 14px; }
      .wheel-card { padding: 17px 12px 19px; border-radius: 22px; }
      .wheel-heading { padding: 0 4px; }
      .wheel-heading h2 { font-size: 14px; }
      .count-pill { padding: 6px 9px; font-size: 11px; }
      .wheel-wrap { width: min(100%, 490px); }
      .spin-button { min-width: 88px; border-width: 5px; }
      .pointer { border-left-width: 12px; border-right-width: 12px; border-top-width: 27px; }
      .wheel-caption { font-size: 11px; }
      .side { display: flex; gap: 13px; }
      .result-card, .editor-card { padding: 18px; border-radius: 21px; }
      .result-card { min-height: 165px; }
      .winner { min-height: 57px; margin-top: 6px; font-size: clamp(27px, 8vw, 36px); }
      .textarea-wrap { min-height: 230px; }
      textarea { min-height: 230px; font-size: 16px; }
      .editor-card { min-height: 0; }
      .clear-button { min-height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  
    .sound-toggle { width: 44px; height: 44px; }
    .settings-toggle {
      min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 11px; border: 1px solid rgba(213,145,174,.28); border-radius: 13px; color: #80586b;
      cursor: pointer; background: rgba(255,255,255,.78); box-shadow: 0 3px 10px rgba(130,92,110,.08);
      font-size: 12px; font-weight: 800; transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    .settings-toggle:hover:not(:disabled) { transform: translateY(-1px); border-color: #d99db5; background: #fff; }
    .settings-toggle:disabled { cursor: wait; opacity: .55; }
    .settings-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .settings-dialog {
      width: min(640px, calc(100vw - 32px)); max-width: none; max-height: min(86vh, 820px); max-height: min(86dvh, 820px);
      margin: auto; padding: 0; overflow: hidden; border: 1px solid #e7d5df; border-radius: 23px;
      color: #4b3b48; background: #fffafc; box-shadow: 0 28px 90px rgba(88, 56, 75, .28);
    }
    .settings-dialog::backdrop { background: rgba(59, 40, 53, .42); backdrop-filter: blur(3px); }
    .settings-shell { max-height: inherit; display: flex; flex-direction: column; }
    .settings-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 22px 23px 15px; border-bottom: 1px solid #eee2e8; }
    .settings-header h2 { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 900; }
    .settings-header p { margin: 6px 0 0; color: #665563; font-size: 13px; line-height: 1.6; }
    .settings-close { width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border: 1px solid #e8dce3; border-radius: 13px; color: #65505d; cursor: pointer; background: #fff; }
    .settings-close:hover { border-color: #d89ab3; background: #fff3f7; }
    .settings-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .settings-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 23px; background: #fff3f7; }
    .settings-summary strong { flex: 0 0 auto; color: #80415d; font-size: 14px; font-variant-numeric: tabular-nums; }
    .settings-summary p { margin: 0; color: #624c5a; font-size: 12px; line-height: 1.5; text-align: right; }
    #shareStatus[data-state="error"] { color: #8f334e; }
    #shareStatus[data-state="success"] { color: #3f7152; }
    .settings-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 23px 9px; color: #655361; font-size: 12px; font-weight: 800; }
    .equal-share-button { min-height: 44px; padding: 0 13px; border: 1px solid #e4cbd7; border-radius: 12px; color: #8c4d67; cursor: pointer; background: #fff; font-size: 12px; font-weight: 800; }
    .equal-share-button:hover:not(:disabled) { border-color: #d18ca7; background: #fff1f6; }
    .equal-share-button:disabled { color: #867982; cursor: not-allowed; background: #f5f1f3; }
    .settings-list { flex: 1 1 auto; min-height: 0; max-height: 50vh; overflow: auto; overscroll-behavior: contain; padding: 0 23px 8px; scrollbar-color: #c9aebc #f8eff3; scrollbar-width: thin; }
    .share-row { min-height: 59px; display: grid; grid-template-columns: minmax(0, 1fr) 132px; align-items: center; gap: 16px; padding: 7px 0; border-bottom: 1px solid #eee5e9; }
    .share-row:last-child { border-bottom: 0; }
    .share-name-wrap { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .share-index { width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 9px; color: #79576a; background: #f5e8ef; font-size: 11px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .share-name { color: #4b3b48; font-size: 14px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
    .share-input-wrap { display: flex; align-items: center; gap: 7px; }
    .share-input { width: 100%; min-width: 0; min-height: 44px; padding: 0 10px; border: 1px solid #d9c4d0; border-radius: 11px; outline: none; color: #493844; background: #fff; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
    .share-input:focus-visible { border-color: #b95b80; }
    .share-unit { color: #665563; font-size: 13px; font-weight: 800; }
    .settings-empty { padding: 24px 4px; color: #665563; font-size: 13px; line-height: 1.7; text-align: center; }
    .settings-footer { padding: 14px 23px 20px; border-top: 1px solid #eee2e8; }
    .settings-done { width: 100%; min-height: 48px; border: 0; border-radius: 14px; color: #fff; cursor: pointer; background: linear-gradient(145deg, #d986a5, #c36f92); font-size: 15px; font-weight: 900; box-shadow: 0 6px 15px rgba(181, 98, 134, .2); }
    .settings-done:hover { filter: brightness(1.04); }
    @media (max-width: 560px) {
      .settings-dialog { width: calc(100vw - 20px); max-height: calc(100vh - 20px); max-height: calc(100dvh - 20px); border-radius: 19px; }
      .settings-header { padding: 18px 16px 13px; }
      .settings-header h2 { font-size: 19px; }
      .settings-summary { align-items: flex-start; padding: 12px 16px; }
      .settings-summary p { max-width: 58%; }
      .settings-toolbar { padding-inline: 16px; }
      .settings-list { max-height: 52vh; padding-inline: 16px; }
      .share-row { grid-template-columns: minmax(0, 1fr) 112px; gap: 10px; }
      .share-name { font-size: 13px; }
      .settings-footer { padding: 12px 16px 16px; }
      .wheel-heading { flex-wrap: wrap; }
      .wheel-heading h2 { width: 100%; }
      .wheel-controls { width: 100%; justify-content: flex-end; }
    }
    @media (max-width: 360px) {
      .settings-header { gap: 8px; }
      .share-row { grid-template-columns: minmax(0, 1fr) 96px; gap: 7px; }
      .share-input { padding-inline: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .settings-toggle, .settings-done { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✿</div>
        <div><p class="eyebrow">MACARON ROULETTE</p><h1>溫柔漂亮可愛QQ台姐大轉盤</h1></div>
      </div>
      <div class="header-note">選項交給轉盤<br>今天就輕鬆決定吧</div>
    </header>

    <div class="layout">
      <section class="card wheel-card" aria-label="隨機抽選轉盤">
        <div class="wheel-heading">
          <h2>準備好轉動了嗎？</h2>
          <div class="wheel-controls"><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="關閉轉盤音效" title="音效開啟">🔊</button><button class="settings-toggle" id="settingsToggle" type="button" aria-haspopup="dialog" aria-controls="settingsDialog" aria-expanded="false" aria-label="設定各選項占比" title="設定占比"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path><path d="m19.4 13.5 1.2.9-1.5 2.6-1.4-.6a7.8 7.8 0 0 1-1.7 1l-.2 1.5h-3l-.3-1.5a7.8 7.8 0 0 1-1.7-1l-1.4.6-1.5-2.6 1.2-.9a7.8 7.8 0 0 1 0-2l-1.2-.9 1.5-2.6 1.4.6a7.8 7.8 0 0 1 1.7-1l.3-1.5h3l.2 1.5a7.8 7.8 0 0 1 1.7 1l1.4-.6 1.5 2.6-1.2.9a7.8 7.8 0 0 1 0 2z"></path></svg><span>設定</span></button><span class="count-pill" id="optionCount">0 個選項</span></div>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" aria-label="可自訂選項的馬卡龍色轉盤"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button" aria-label="開始轉動轉盤" disabled>
            <strong>開始</strong><span>SPIN</span>
          </button>
        </div>
        <p class="wheel-caption" id="wheelCaption">先在右側加入至少兩個選項</p>
      </section>

      <aside class="side">
        <section class="card result-card" aria-live="polite">
          <div class="section-heading"><h2>轉盤結果</h2><span class="tag">YOUR PICK</span></div>
          <div class="winner" id="winner">等待你的選項</div>
          <p class="result-hint" id="resultHint">每一行都是一個選項。轉盤停下後，結果會顯示在這裡。</p>
        </section>

        <section class="card editor-card">
          <div class="section-heading"><h2>編輯選項</h2><span class="tag">每行一個</span></div>
          <p class="editor-intro">貼上或輸入想抽選的內容，空白行會自動略過。重複的選項會分別計入抽選。</p>
          <div class="textarea-wrap">
            <textarea id="optionsInput" aria-label="轉盤選項，每行一個" placeholder="例如：&#10;喝杯奶茶&#10;休息一下&#10;看一本書" spellcheck="false"></textarea>
          </div>
          <div class="editor-footer">
            <div class="save-status" id="saveStatus"><span class="save-dot" aria-hidden="true"></span><span>自動保存在這台裝置</span></div>
            <button class="clear-button" id="clearButton" type="button" disabled>清空清單</button>
          </div>
          <div class="tip" id="validationHint">輸入至少兩個選項即可開始轉動。清單只保存在目前的瀏覽器，不會同步到其他裝置。</div>
        </section>
      </aside>
    </div>
  </main>

      <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle" aria-describedby="settingsIntro">
        <section class="settings-shell">
          <header class="settings-header">
            <div>
              <h2 id="settingsTitle" tabindex="-1">調整轉盤占比</h2>
              <p id="settingsIntro">每項占比同時決定扇形大小與抽中機率，總和需為 100%。</p>
            </div>
            <button class="settings-close" id="closeSettings" type="button" aria-label="關閉設定">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
          </header>
          <div class="settings-summary">
            <strong id="shareTotal">總和 0%</strong>
            <p id="shareStatus" data-state="neutral" role="status" aria-live="polite">每行代表一個獨立選項。</p>
          </div>
          <div class="settings-toolbar">
            <span>每個選項</span>
            <button class="equal-share-button" id="equalShareButton" type="button">平均分配</button>
          </div>
          <div class="settings-list" id="settingsList" aria-label="各選項占比"></div>
          <footer class="settings-footer">
            <button class="settings-done" id="doneSettings" type="button">完成</button>
          </footer>
        </section>
      </dialog>

  <script>
    (() => {
      const STORAGE_KEY = "macaron-wheel-options-v1";
      const SHARE_STORAGE_KEY = "macaron-wheel-shares-v1";
      const TAU = Math.PI * 2;
      const colors = ["#f4b5c8", "#f7c897", "#f8dfa0", "#b9ddc4", "#a9d9dc", "#b7c9ed", "#cbb9e8", "#e3b8d4"];
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const input = document.getElementById("optionsInput");
      const spinButton = document.getElementById("spinButton");
      const clearButton = document.getElementById("clearButton");
      const settingsToggle = document.getElementById("settingsToggle");
      const settingsDialog = document.getElementById("settingsDialog");
      const settingsTitle = document.getElementById("settingsTitle");
      const closeSettingsButton = document.getElementById("closeSettings");
      const doneSettingsButton = document.getElementById("doneSettings");
      const equalShareButton = document.getElementById("equalShareButton");
      const settingsList = document.getElementById("settingsList");
      const shareTotal = document.getElementById("shareTotal");
      const shareStatus = document.getElementById("shareStatus");
      const winner = document.getElementById("winner");
      const resultHint = document.getElementById("resultHint");
      const countLabel = document.getElementById("optionCount");
      const wheelCaption = document.getElementById("wheelCaption");
      const validationHint = document.getElementById("validationHint");
      const saveStatus = document.getElementById("saveStatus");
      let entries = [];
      let shares = [];
      let shareDraft = null;
      let draftInvalid = false;
      let rotation = 0;
      let spinning = false;
      const SOUND_STEP = Math.PI;
      let soundEnabled = true;
      let soundContext = null;
      let lastSoundMark = 0;
      let animationFrame = 0;

      function getSoundContext() {
        if (!soundEnabled) return null;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!soundContext) soundContext = new AudioContextClass();
        if (soundContext.state === "suspended") soundContext.resume().catch(() => {});
        return soundContext;
      }

      function playWheelTone(frequency, delay, duration, volume, type) {
        const audio = getSoundContext();
        if (!audio) return;
        const start = audio.currentTime + delay;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type || "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function wheelSpinSound() {
        playWheelTone(460, 0, 0.075, 0.035, "sine");
      }

      function wheelTickSound() {
        playWheelTone(980, 0, 0.026, 0.035, "triangle");
      }

      function wheelWinSound() {
        if (!soundEnabled) return;
        playWheelTone(660, 0, 0.13, 0.045, "sine");
        playWheelTone(784, 0.12, 0.15, 0.045, "sine");
        playWheelTone(1047, 0.25, 0.25, 0.05, "sine");
      }

      function updateSoundButton() {
        const button = document.getElementById("soundToggle");
        button.textContent = soundEnabled ? "🔊" : "🔇";
        button.setAttribute("aria-pressed", String(soundEnabled));
        button.setAttribute("aria-label", soundEnabled ? "關閉轉盤音效" : "開啟轉盤音效");
        button.title = soundEnabled ? "音效開啟" : "音效關閉";
      }

      document.getElementById("soundToggle").addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        updateSoundButton();
        if (soundEnabled) getSoundContext();
      });
      updateSoundButton();

      function normalize(angle) {
        return ((angle % TAU) + TAU) % TAU;
      }

      function parseEntries(value) {
        return value.split(/\r?\n/).map(entry => entry.trim()).filter(Boolean);
      }

      function entryKeys(names) {
        const counts = new Map();
        return names.map(name => {
          const occurrence = counts.get(name) || 0;
          counts.set(name, occurrence + 1);
          return JSON.stringify([name, occurrence]);
        });
      }

      function equalPercentages(count) {
        if (!count) return [];
        const totalUnits = 10000;
        const base = Math.floor(totalUnits / count);
        const remainder = totalUnits - base * count;
        return Array.from({ length: count }, (_, index) => (base + (index < remainder ? 1 : 0)) / 100);
      }

      function normalizePercentages(values) {
        if (!values.length) return [];
        const safeValues = values.map(value => {
          const number = Number(value);
          return Number.isFinite(number) ? Math.max(0, number) : 0;
        });
        const total = safeValues.reduce((sum, value) => sum + value, 0);
        if (total <= 0) return equalPercentages(values.length);
        const exactUnits = safeValues.map(value => value / total * 10000);
        const units = exactUnits.map(Math.floor);
        let remaining = 10000 - units.reduce((sum, value) => sum + value, 0);
        const remainderOrder = exactUnits.map((value, index) => ({ index, fraction: value - units[index] }))
          .sort((a, b) => b.fraction - a.fraction);
        for (let i = 0; i < remaining; i++) units[remainderOrder[i % remainderOrder.length].index] += 1;
        return units.map(value => value / 100);
      }

      function percentagesHaveValidTotal(values) {
        return values.length > 0 &&
          values.every(value => Number.isFinite(value) && value >= 0 && value <= 100) &&
          values.reduce((sum, value) => sum + Math.round(value * 100), 0) === 10000;
      }

      function loadSavedShares(names) {
        if (!names.length) return [];
        try {
          const raw = localStorage.getItem(SHARE_STORAGE_KEY);
          if (!raw) return null;
          const saved = JSON.parse(raw);
          if (!saved || saved.version !== 1 || !Array.isArray(saved.items)) return null;
          const byKey = new Map(saved.items.map(item => [item.key, Number(item.value)]));
          const keys = entryKeys(names);
          const values = keys.map(key => byKey.has(key) ? byKey.get(key) : NaN);
          if (!percentagesHaveValidTotal(values)) return null;
          return values.map(value => Math.round(value * 100) / 100);
        } catch (error) {
          return null;
        }
      }

      function saveShares() {
        try {
          if (!entries.length) {
            localStorage.removeItem(SHARE_STORAGE_KEY);
            return;
          }
          const keys = entryKeys(entries);
          const items = entries.map((name, index) => ({ key: keys[index], value: shares[index] }));
          localStorage.setItem(SHARE_STORAGE_KEY, JSON.stringify({ version: 1, items }));
        } catch (error) {
          saveStatus.lastElementChild.textContent = "瀏覽器無法保存占比";
        }
      }

      function reconcileShares(oldEntries, oldShares, newEntries) {
        if (!newEntries.length) return [];
        if (!oldEntries.length || !oldShares.length) return equalPercentages(newEntries.length);
        const oldKeys = entryKeys(oldEntries);
        const newKeys = entryKeys(newEntries);
        const oldIndexByKey = new Map(oldKeys.map((key, index) => [key, index]));
        const nextShares = Array(newEntries.length).fill(null);
        const usedOld = new Set();

        newKeys.forEach((key, index) => {
          const oldIndex = oldIndexByKey.get(key);
          if (oldIndex !== undefined && !usedOld.has(oldIndex)) {
            nextShares[index] = oldShares[oldIndex];
            usedOld.add(oldIndex);
          }
        });

        newEntries.forEach((_, index) => {
          if (nextShares[index] !== null) return;
          if (index < oldEntries.length && !usedOld.has(index)) {
            nextShares[index] = oldShares[index];
            usedOld.add(index);
          }
        });

        const newEntryDefault = 100 / oldEntries.length;
        const values = nextShares.map(value => value === null ? newEntryDefault : value);
        return normalizePercentages(values);
      }

      function formatPercent(value) {
        return Number(Number(value).toFixed(2)).toString();
      }

      function updateSpinState() {
        const sumValid = percentagesHaveValidTotal(shares);
        const activeCount = shares.filter(value => value > 0).length;
        const canSpin = entries.length >= 2 && sumValid && activeCount >= 2 && !draftInvalid;
        spinButton.disabled = spinning || !canSpin;
        settingsToggle.disabled = spinning;
        settingsToggle.setAttribute("aria-disabled", String(spinning));
        clearButton.disabled = spinning || input.value.length === 0;
      }

      function updateWheelCaption() {
        if (!entries.length) {
          wheelCaption.textContent = "先在下方加入至少兩個選項";
        } else if (entries.length < 2) {
          wheelCaption.textContent = "再加入一個選項就可以開始";
        } else if (draftInvalid) {
          wheelCaption.textContent = "請完成設定，讓各項占比總和等於 100%";
        } else if (shares.filter(value => value > 0).length < 2) {
          wheelCaption.textContent = "至少兩個選項的占比需大於 0% 才能開始";
        } else if (entries.length > 24) {
          wheelCaption.textContent = "已加入 " + entries.length + " 個選項 · 占比同步決定扇形與抽中機率";
        } else {
          wheelCaption.textContent = "已加入 " + entries.length + " 個選項 · 可在設定中調整占比";
        }
      }

      function updateOptions() {
        const nextEntries = parseEntries(input.value);
        shares = reconcileShares(entries, shares, nextEntries);
        entries = nextEntries;
        draftInvalid = false;
        countLabel.textContent = entries.length + " 個選項";
        updateSpinState();

        if (entries.length < 2) {
          validationHint.textContent = "輸入至少兩個選項即可開始轉動。清單與占比只保存在目前的瀏覽器。";
        } else if (entries.length > 24) {
          validationHint.textContent = "每項占比同時決定扇形大小和抽中機率。選項超過 24 個時會隱藏扇形文字，抽選結果仍會顯示。";
        } else {
          validationHint.textContent = "每項占比同時決定扇形大小和抽中機率。每一行都是獨立選項，清單與占比只保存在目前的瀏覽器。";
        }

        try {
          localStorage.setItem(STORAGE_KEY, input.value);
          if (saveStatus.lastElementChild.textContent !== "瀏覽器未允許本機保存" &&
              saveStatus.lastElementChild.textContent !== "瀏覽器無法保存占比") {
            saveStatus.lastElementChild.textContent = "自動保存在這台裝置";
          }
        } catch (error) {
          saveStatus.lastElementChild.textContent = "本機保存空間不可用";
        }

        saveShares();
        updateWheelCaption();
        drawWheel();
      }

      function renderSettings() {
        settingsList.replaceChildren();
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "settings-empty";
          empty.textContent = "先在清單加入選項，就能為每一項設定占比。";
          settingsList.append(empty);
          equalShareButton.disabled = true;
          shareTotal.textContent = "總和 0%";
          shareStatus.textContent = "目前沒有可調整的選項。";
          shareStatus.dataset.state = "neutral";
          return;
        }

        equalShareButton.disabled = false;
        const values = shares.slice();
        entries.forEach((name, index) => {
          const row = document.createElement("label");
          row.className = "share-row";

          const nameWrap = document.createElement("span");
          nameWrap.className = "share-name-wrap";

          const number = document.createElement("span");
          number.className = "share-index";
          number.textContent = String(index + 1).padStart(2, "0");

          const nameLabel = document.createElement("span");
          nameLabel.className = "share-name";
          nameLabel.textContent = name;

          nameWrap.append(number, nameLabel);

          const inputWrap = document.createElement("span");
          inputWrap.className = "share-input-wrap";

          const shareInput = document.createElement("input");
          shareInput.className = "share-input";
          shareInput.type = "number";
          shareInput.min = "0";
          shareInput.max = "100";
          shareInput.step = "0.01";
          shareInput.inputMode = "decimal";
          shareInput.value = formatPercent(values[index] || 0);
          shareInput.setAttribute("aria-label", "第 " + (index + 1) + " 項「" + name + "」占比百分比");

          const unit = document.createElement("span");
          unit.className = "share-unit";
          unit.textContent = "%";

          inputWrap.append(shareInput, unit);
          row.append(nameWrap, inputWrap);
          settingsList.append(row);
        });
        validateShareInputs();
      }

      function validateShareInputs() {
        const fields = Array.from(settingsList.querySelectorAll(".share-input"));
        const complete = fields.length === entries.length &&
          fields.every(field => field.value.trim() !== "" && field.validity.valid);
        const values = complete ? fields.map(field => Number(field.value)) : [];
        const sumUnits = complete ? values.reduce((sum, value) => sum + Math.round(value * 100), 0) : 0;
        const sum = complete ? sumUnits / 100 : null;
        shareTotal.textContent = "總和 " + (sum === null ? "—" : formatPercent(sum)) + "%";
        const exactTotal = complete && sumUnits === 10000;
        draftInvalid = !exactTotal;

        if (!complete) {
          shareStatus.textContent = "請輸入 0–100 的百分比，最多兩位小數。";
          shareStatus.dataset.state = "error";
        } else if (!exactTotal) {
          const difference = formatPercent(Math.abs(100 - sum));
          shareStatus.textContent = sum < 100
            ? "還差 " + difference + "% 才到 100%。"
            : "超出 " + difference + "%；請調整至 100%。";
          shareStatus.dataset.state = "error";
        } else if (values.filter(value => value > 0).length < 2) {
          shareStatus.textContent = "至少兩個選項需大於 0% 才能轉動。";
          shareStatus.dataset.state = "error";
        } else {
          shareStatus.textContent = "占比已套用到扇形大小和抽中機率。";
          shareStatus.dataset.state = "success";
        }

        if (exactTotal) {
          shares = values.map(value => Math.round(value * 100) / 100);
          shareDraft = shares.slice();
          saveShares();
          drawWheel();
        } else {
          shareDraft = values;
        }
        updateSpinState();
        updateWheelCaption();
      }

      function openSettings() {
        if (spinning) return;
        shareDraft = shares.slice();
        renderSettings();
        if (typeof settingsDialog.showModal === "function") {
          settingsDialog.showModal();
        } else {
          settingsDialog.setAttribute("open", "");
        }
        settingsToggle.setAttribute("aria-expanded", "true");
        settingsTitle.focus();
      }

      function discardInvalidDraft() {
        draftInvalid = false;
        shareDraft = null;
        updateSpinState();
        updateWheelCaption();
      }

      settingsToggle.addEventListener("click", openSettings);
      settingsList.addEventListener("input", validateShareInputs);
      closeSettingsButton.addEventListener("click", () => settingsDialog.close());
      doneSettingsButton.addEventListener("click", () => settingsDialog.close());
      settingsDialog.addEventListener("cancel", () => {
        discardInvalidDraft();
      });
      settingsDialog.addEventListener("close", () => {
        settingsToggle.setAttribute("aria-expanded", "false");
        discardInvalidDraft();
      });
      settingsDialog.addEventListener("click", event => {
        if (event.target === settingsDialog) settingsDialog.close();
      });
      equalShareButton.addEventListener("click", () => {
        shares = equalPercentages(entries.length);
        shareDraft = shares.slice();
        draftInvalid = false;
        saveShares();
        renderSettings();
        updateSpinState();
        updateWheelCaption();
        drawWheel();
        equalShareButton.focus();
      });

      function drawWheel() {
        const size = Math.floor(canvas.getBoundingClientRect().width);
        if (!size) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pixels = Math.round(size * dpr);
        if (canvas.width !== pixels || canvas.height !== pixels) {
          canvas.width = pixels;
          canvas.height = pixels;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size, size);

        const center = size / 2;
        const radius = size * .465;
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(rotation);

        if (entries.length) {
          let cumulative = 0;
          for (let i = 0; i < entries.length; i++) {
            const angle = TAU * (shares[i] || 0) / 100;
            const start = -Math.PI / 2 + cumulative;
            const end = start + angle;
            if (angle <= 0) continue;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, start, end);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,.82)";
            ctx.lineWidth = Math.max(1, size * .003);
            ctx.stroke();

            if (entries.length <= 24 && angle >= .14) {
              const middle = start + angle / 2;
              const screenAngle = normalize(middle + rotation);
              ctx.save();
              ctx.rotate(middle);
              ctx.translate(radius * .73, 0);
              if (screenAngle > Math.PI / 2 && screenAngle < Math.PI * 1.5) ctx.rotate(Math.PI);
              const sizeScale = Math.max(.58, 1 - Math.max(0, entries.length - 10) * .035);
              const fontSize = Math.max(9, Math.min(16, size * .035) * sizeScale);
              ctx.fillStyle = "#574552";
              ctx.font = "700 " + fontSize + "px system-ui, sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(entries[i], 0, 0, radius * .58);
              ctx.restore();
            }
            cumulative += angle;
          }
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fillStyle = "#f9edf2";
          ctx.fill();
          ctx.setLineDash([size * .018, size * .018]);
          ctx.strokeStyle = "#e9c8d5";
          ctx.lineWidth = size * .012;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#ae91a0";
          ctx.font = "700 " + Math.max(13, size * .035) + "px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("先加入選項", 0, 0);
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(center, center, radius + size * .012, 0, TAU);
        ctx.strokeStyle = "rgba(255,255,255,.95)";
        ctx.lineWidth = size * .022;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(center, center, radius + size * .027, 0, TAU);
        ctx.strokeStyle = "rgba(213,145,174,.25)";
        ctx.lineWidth = size * .008;
        ctx.stroke();

        for (let i = 0; i < 32; i++) {
          const angle = i * TAU / 32 - Math.PI / 2;
          const dotRadius = radius + size * .027;
          ctx.beginPath();
          ctx.arc(center + Math.cos(angle) * dotRadius, center + Math.sin(angle) * dotRadius, Math.max(1.7, size * .006), 0, TAU);
          ctx.fillStyle = i % 4 === 0 ? "#fff" : "#edc4d2";
          ctx.fill();
        }
      }

      function finishSpin(name) {
        wheelWinSound();
        winner.textContent = name;
        resultHint.textContent = "這次就選它吧！選項保留在清單中，可以再轉一次。";
        spinning = false;
        input.disabled = false;
        updateSpinState();
      }

      function spin() {
        if (spinning || draftInvalid || entries.length < 2) return;
        const activeCount = shares.filter(value => value > 0).length;
        if (activeCount < 2 || !percentagesHaveValidTotal(shares)) return;

        lastSoundMark = Math.floor(rotation / SOUND_STEP);
        wheelSpinSound();
        const spinEntries = entries.slice();
        const spinShares = shares.slice();
        const sample = Math.random() * 100;
        let selectedIndex = -1;
        let cumulativeShare = 0;
        for (let i = 0; i < spinShares.length; i++) {
          cumulativeShare += spinShares[i];
          if (spinShares[i] > 0 && sample < cumulativeShare) {
            selectedIndex = i;
            break;
          }
        }
        if (selectedIndex < 0) selectedIndex = spinShares.findLastIndex(value => value > 0);
        if (selectedIndex < 0) return;

        const beforeShare = spinShares.slice(0, selectedIndex).reduce((sum, value) => sum + value, 0);
        const selectedShare = spinShares[selectedIndex];
        const targetRotation = -((beforeShare + selectedShare / 2) / 100 * TAU);
        const delta = 8 * TAU + normalize(targetRotation - normalize(rotation));
        const startRotation = rotation;
        const startTime = performance.now();
        const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 700 : 5000;

        spinning = true;
        input.disabled = true;
        updateSpinState();
        resultHint.textContent = "轉盤正在旋轉，看看命運會選中哪一項…";

        function frame(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 4);
          rotation = startRotation + delta * eased;
          if (duration > 1200) {
            const soundMark = Math.floor(rotation / SOUND_STEP);
            if (soundMark > lastSoundMark) { lastSoundMark = soundMark; wheelTickSound(); }
          }
          drawWheel();
          if (progress < 1) {
            animationFrame = requestAnimationFrame(frame);
          } else {
            rotation = normalize(startRotation + delta);
            drawWheel();
            finishSpin(spinEntries[selectedIndex]);
          }
        }
        animationFrame = requestAnimationFrame(frame);
      }

      input.addEventListener("input", updateOptions);
      spinButton.addEventListener("click", spin);
      clearButton.addEventListener("click", () => {
        if (spinning) return;
        input.value = "";
        winner.textContent = "等待你的選項";
        resultHint.textContent = "每一行都是一個選項。轉盤停下後，結果會顯示在這裡。";
        updateOptions();
        input.focus();
      });
      window.addEventListener("resize", drawWheel);
      if ("ResizeObserver" in window) {
        new ResizeObserver(drawWheel).observe(canvas);
      }

      try {
        input.value = localStorage.getItem(STORAGE_KEY) || "";
      } catch (error) {
        saveStatus.lastElementChild.textContent = "瀏覽器未允許本機保存";
      }
      entries = parseEntries(input.value);
      shares = loadSavedShares(entries) || equalPercentages(entries.length);
      updateOptions();
    })();
  </script>
</body>
</html>
