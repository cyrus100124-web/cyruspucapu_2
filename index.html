<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf7">
  <meta name="description" content="一個可自訂選項、適合手機使用的可愛馬卡龍大轉盤。">
  <title>溫柔漂亮可愛QQ台姐大轉盤</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap');
    :root {
      color-scheme: light;
      --ink: #473c49; --muted: #6f626e; --quiet: #81717e;
      --paper: #fffaf7; --pink: #efabc2; --pink-deep: #b64d76;
      --mint: #b9dec9; --lilac: #cec2e9; --butter: #f4d98f; --sky: #afdce0;
      --line: #e8dce3; --line-strong: #d9c4d0; --shadow: 0 18px 48px rgba(110, 80, 100, .11);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: "DM Sans", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 0% 8%, rgba(244, 208, 221, .64), transparent 32rem),
        radial-gradient(ellipse at 100% 29%, rgba(202, 228, 211, .62), transparent 31rem),
        radial-gradient(ellipse at 58% 112%, rgba(215, 206, 241, .54), transparent 35rem),
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    button, textarea { font: inherit; }
    button { touch-action: manipulation; }
    ::selection { color: #403441; background: #f3c1d2; }
    :focus-visible { outline: 3px solid #a7426c; outline-offset: 4px; }
    .page { width: min(1200px, calc(100% - 44px)); margin: 0 auto; padding: 28px 0 52px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-mark {
      width: 50px; height: 50px; flex: 0 0 50px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.88); border-radius: 18px; color: #62444f;
      background: linear-gradient(145deg, #f4c4d2, #d6c9ed);
      box-shadow: 0 7px 20px rgba(185, 137, 161, .2);
    }
    .brand-mark svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0; font-family: Nunito, "Microsoft JhengHei", sans-serif; font-size: clamp(25px, 3.4vw, 39px); font-weight: 900; letter-spacing: -.025em; line-height: 1.12; }
    .header-note { color: var(--muted); font-size: 13px; font-weight: 600; text-align: right; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.14fr) minmax(340px, .86fr); gap: 18px; align-items: stretch; }
    .card { border: 1px solid rgba(255,255,255,.92); border-radius: 24px; background: rgba(255,255,255,.76); box-shadow: var(--shadow); }
    .wheel-card { min-width: 0; min-height: 660px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px clamp(17px, 3vw, 32px) 21px; overflow: hidden; }
    .wheel-heading { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 6px; }
    .wheel-heading h2, .section-heading h2 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 800; }
    .wheel-controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .count-pill { padding: 7px 11px; border: 1px solid #ead0dc; border-radius: 99px; color: #84475f; background: #fff0f5; font-size: 12px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sound-toggle {
      width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid var(--line-strong); border-radius: 50%; color: #725564; cursor: pointer;
      background: #fff; box-shadow: 0 3px 9px rgba(110,80,100,.06);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .sound-toggle:hover { transform: translateY(-1px); border-color: #d89ab3; background: #fff7fa; }
    .sound-toggle[aria-pressed="false"] { color: #746b72; background: #f8f4f6; }
    .sound-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-wrap { position: relative; width: min(100%, 570px); aspect-ratio: 1; display: grid; place-items: center; margin: 3px auto 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .pointer { position: absolute; z-index: 2; top: -1px; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 31px solid #fff; filter: drop-shadow(0 3px 4px rgba(100, 70, 88, .26)); }
    .spin-button {
      position: absolute; z-index: 3; width: 25%; min-width: 102px; aspect-ratio: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      border: 6px solid rgba(255,255,255,.86); border-radius: 50%; color: #fff; cursor: pointer;
      background: linear-gradient(145deg, #e999b6, #ca7297 82%);
      box-shadow: 0 8px 19px rgba(181, 98, 134, .26), inset 0 1px 0 rgba(255,255,255,.6);
      transition: transform .2s cubic-bezier(.2,.8,.2,1), filter .2s ease;
    }
    .spin-button strong { font-size: clamp(17px, 2vw, 22px); font-weight: 900; }
    .spin-button span { font-size: 10px; font-weight: 800; letter-spacing: .16em; }
    .spin-button:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.05); }
    .spin-button:active:not(:disabled) { transform: scale(.98); }
    .spin-button:disabled { cursor: wait; opacity: .72; }
    .wheel-caption { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; text-align: center; }
    .side { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px; }
    .result-card, .editor-card { padding: 21px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag { padding: 6px 9px; border: 1px solid #ecd6df; border-radius: 99px; color: #80576a; background: #fff6f8; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .winner { min-height: 76px; display: flex; align-items: center; margin: 10px 0 2px; color: #a4476d; font-family: Nunito, "Microsoft JhengHei", sans-serif; font-size: clamp(31px, 3.5vw, 45px); font-weight: 900; line-height: 1.12; overflow-wrap: anywhere; }
    .result-hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .editor-intro { margin: 11px 0 12px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .textarea-wrap { min-width: 0; }
    textarea { width: 100%; min-height: 208px; display: block; resize: vertical; padding: 14px 15px; border: 1px solid var(--line-strong); border-radius: 14px; outline: none; color: var(--ink); background: #fffdfd; font-size: 14px; line-height: 1.8; }
    textarea::placeholder { color: #776b74; opacity: 1; }
    textarea:focus-visible { border-color: #b95b80; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; }
    .save-status { min-width: 0; display: flex; align-items: center; gap: 8px; color: #5f7564; font-size: 12px; line-height: 1.5; }
    .save-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: #6fa881; box-shadow: 0 0 0 3px #e0f0e5; }
    .clear-button { min-height: 44px; padding: 0 13px; border: 1px solid #e4cdd7; border-radius: 11px; color: #8d4c67; cursor: pointer; background: #fff7fa; font-size: 12px; font-weight: 800; transition: border-color .18s ease, background .18s ease, color .18s ease; }
    .clear-button:hover:not(:disabled) { border-color: #ce829f; color: #753b56; background: #ffedf3; }
    .clear-button:disabled { color: #867982; cursor: not-allowed; background: #f4eff2; }
    .tip { margin-top: 13px; padding: 11px 12px; border: 1px solid #d9e7dc; border-radius: 12px; color: #4c6554; background: #f0f8f1; font-size: 12px; line-height: 1.65; }
    @media (min-width: 1180px) { .wheel-card { min-height: 710px; } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr) minmax(300px, .9fr); gap: 13px; }
      .wheel-card { min-height: 580px; padding-inline: 17px; }
      .result-card, .editor-card { padding: 17px; }
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 28px, 600px); padding: 20px 0 34px; }
      header { align-items: flex-start; margin-bottom: 17px; }
      .header-note { max-width: 145px; padding-top: 3px; font-size: 12px; }
      .brand { gap: 10px; }
      .brand-mark { width: 42px; height: 42px; flex-basis: 42px; border-radius: 15px; }
      h1 { font-size: clamp(24px, 6.4vw, 34px); }
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .wheel-card { min-height: 0; padding: 16px 14px 19px; }
      .wheel-wrap { width: min(100%, 540px); }
      .side { grid-template-rows: auto auto; gap: 14px; }
      .result-card, .editor-card { padding: 18px; }
      .winner { min-height: 58px; font-size: clamp(34px, 9vw, 46px); }
      textarea { min-height: 190px; }
    }
    @media (max-width: 390px) {
      .page { width: calc(100% - 20px); }
      header { gap: 9px; }
      .header-note { max-width: 108px; font-size: 11px; }
      .wheel-heading h2, .section-heading h2 { font-size: 14px; }
      .count-pill { padding-inline: 8px; font-size: 11px; }
      .wheel-controls { gap: 6px; }
      .sound-toggle { width: 42px; height: 42px; }
      .wheel-caption { max-width: 32ch; }
      .editor-footer { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4c1.1 2.8 2.3 4 5 3-1 2.7.2 4 3 5-2.8 1.1-4 2.3-3 5-2.7-1-4-.2-5 3-1.1-2.8-2.3-4-5-3 1-2.7-.2-4-3-5 2.8-1.1 4-2.3 3-5 2.7 1 4 .2 5-3z"></path><circle cx="12" cy="12" r="2.2"></circle></svg></div>
        <div><h1>溫柔漂亮可愛QQ台姐大轉盤</h1></div>
      </div>
      <div class="header-note">選項交給轉盤<br>今天就輕鬆決定吧</div>
    </header>

    <div class="layout">
      <section class="card wheel-card" aria-label="隨機抽選轉盤">
        <div class="wheel-heading">
          <h2>準備好轉動了嗎？</h2>
          <div class="wheel-controls"><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="關閉轉盤音效" title="音效開啟"></button><span class="count-pill" id="optionCount">0 個選項</span></div>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" aria-label="可自訂選項的馬卡龍色轉盤"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button" aria-label="開始轉動轉盤" disabled>
            <strong>開始</strong><span>SPIN</span>
          </button>
        </div>
        <p class="wheel-caption" id="wheelCaption">先在右側加入至少兩個選項</p>
      </section>

      <aside class="side">
        <section class="card result-card" aria-live="polite">
          <div class="section-heading"><h2>轉盤結果</h2><span class="tag">YOUR PICK</span></div>
          <div class="winner" id="winner">等待你的選項</div>
          <p class="result-hint" id="resultHint">每一行都是一個選項。轉盤停下後，結果會顯示在這裡。</p>
        </section>

        <section class="card editor-card">
          <div class="section-heading"><h2>編輯選項</h2><span class="tag">每行一個</span></div>
          <p class="editor-intro">貼上或輸入想抽選的內容，空白行會自動略過。重複的選項會分別計入抽選。</p>
          <div class="textarea-wrap">
            <textarea id="optionsInput" aria-label="轉盤選項，每行一個" placeholder="例如：&#10;喝杯奶茶&#10;休息一下&#10;看一本書" spellcheck="false"></textarea>
          </div>
          <div class="editor-footer">
            <div class="save-status" id="saveStatus"><span class="save-dot" aria-hidden="true"></span><span>自動保存在這台裝置</span></div>
            <button class="clear-button" id="clearButton" type="button" disabled>清空清單</button>
          </div>
          <div class="tip" id="validationHint">輸入至少兩個選項即可開始轉動。清單只保存在目前的瀏覽器，不會同步到其他裝置。</div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "macaron-wheel-options-v1";
      const TAU = Math.PI * 2;
      const colors = ["#efb3c7", "#f3d98f", "#bddfca", "#afdce0", "#c8b9e7", "#efc29e", "#dcaed0", "#b9d4eb"];
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const input = document.getElementById("optionsInput");
      const spinButton = document.getElementById("spinButton");
      const clearButton = document.getElementById("clearButton");
      const winner = document.getElementById("winner");
      const resultHint = document.getElementById("resultHint");
      const countLabel = document.getElementById("optionCount");
      const wheelCaption = document.getElementById("wheelCaption");
      const validationHint = document.getElementById("validationHint");
      const saveStatus = document.getElementById("saveStatus");
      let entries = [];
      let rotation = 0;
      let spinning = false;
      const SOUND_STEP = Math.PI;
      let soundEnabled = true;
      let soundContext = null;
      let lastSoundMark = 0;
  
      function getSoundContext() {
        if (!soundEnabled) return null;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!soundContext) soundContext = new AudioContextClass();
        if (soundContext.state === "suspended") soundContext.resume().catch(() => {});
        return soundContext;
      }
  
      function playWheelTone(frequency, delay, duration, volume, type) {
        const audio = getSoundContext();
        if (!audio) return;
        const start = audio.currentTime + delay;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type || "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }
  
      function wheelSpinSound() {
        playWheelTone(460, 0, 0.075, 0.035, "sine");
      }
  
      function wheelTickSound() {
        playWheelTone(980, 0, 0.026, 0.035, "triangle");
      }
  
      function wheelWinSound() {
        if (!soundEnabled) return;
        playWheelTone(660, 0, 0.13, 0.045, "sine");
        playWheelTone(784, 0.12, 0.15, 0.045, "sine");
        playWheelTone(1047, 0.25, 0.25, 0.05, "sine");
      }
  
      function updateSoundButton() {
      const button = document.getElementById("soundToggle");
      button.innerHTML = soundEnabled
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M18.5 6.5a9 9 0 0 1 0 11"></path></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"></path><path d="m17 9 5 6"></path><path d="m22 9-5 6"></path></svg>';
      button.setAttribute("aria-pressed", String(soundEnabled));
      button.setAttribute("aria-label", soundEnabled ? "關閉轉盤音效" : "開啟轉盤音效");
      button.title = soundEnabled ? "音效開啟" : "音效關閉";
    })();
  </script>
</body>
</html>
