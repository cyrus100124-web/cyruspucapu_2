<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3">
  <meta name="description" content="一個可自訂選項、適合手機使用的可愛馬卡龍大轉盤。">
  <title>馬卡龍大轉盤｜隨機選一個</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #51404e;
      --muted: #9a8794;
      --pink: #e987aa;
      --pink-dark: #cf688f;
      --cream: #fffaf5;
      --card: rgba(255, 255, 255, .82);
      --line: rgba(154, 110, 133, .15);
      --shadow: 0 22px 65px rgba(130, 92, 110, .12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 8% 5%, rgba(255, 205, 218, .7), transparent 31rem),
        radial-gradient(ellipse at 95% 24%, rgba(205, 231, 224, .7), transparent 30rem),
        radial-gradient(ellipse at 62% 100%, rgba(229, 216, 248, .58), transparent 35rem),
        #fff8f3;
    }
    button, textarea { font: inherit; }
    button { touch-action: manipulation; }
    .page { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 52px; height: 52px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.9); border-radius: 18px;
      color: #fff; font-size: 27px;
      background: linear-gradient(145deg, #f7b6cb, #d9b8ec);
      box-shadow: 0 9px 24px rgba(218, 151, 182, .28);
    }
    .eyebrow { margin: 0 0 4px; color: var(--pink-dark); font-size: 11px; font-weight: 850; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: .035em; }
    .header-note { color: var(--muted); font-size: 13px; text-align: right; line-height: 1.7; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(310px, .85fr); gap: 22px; align-items: stretch; }
    .card {
      border: 1px solid rgba(255,255,255,.92); border-radius: 27px;
      background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    .wheel-card { min-height: 650px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 26px 28px 24px; overflow: hidden; }
    .wheel-heading { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
    .wheel-heading h2, .section-heading h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .count-pill {
      padding: 7px 11px; border: 1px solid rgba(213, 145, 174, .22); border-radius: 99px;
      color: #bd6b8d; background: #fff0f5; font-size: 12px; white-space: nowrap;
    }
    .wheel-wrap { position: relative; width: min(100%, 560px); aspect-ratio: 1; display: grid; place-items: center; }
    canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 13px 18px rgba(117, 79, 99, .17)); }
    .pointer {
      position: absolute; z-index: 2; top: -1px; left: 50%; width: 0; height: 0; transform: translateX(-50%);
      border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 32px solid #fff;
      filter: drop-shadow(0 4px 4px rgba(97, 70, 88, .2));
    }
    .spin-button {
      position: absolute; z-index: 3; width: 25%; min-width: 105px; aspect-ratio: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 7px solid rgba(255,255,255,.72); border-radius: 50%; color: #fff; cursor: pointer;
      background: linear-gradient(145deg, #f4b1c7, #dc86a9 65%, #ce7ba5);
      box-shadow: 0 10px 26px rgba(204, 113, 151, .3), inset 0 2px 5px rgba(255,255,255,.45);
      transition: transform .18s ease, filter .18s ease;
    }
    .spin-button:hover:not(:disabled) { transform: scale(1.045); filter: brightness(1.04); }
    .spin-button:active:not(:disabled) { transform: scale(.98); }
    .spin-button:disabled { cursor: not-allowed; filter: grayscale(.2); opacity: .72; }
    .spin-button strong { font-size: clamp(17px, 2vw, 22px); letter-spacing: .1em; }
    .spin-button span { margin-top: 3px; font-size: 9px; font-weight: 850; letter-spacing: .18em; opacity: .84; }
    .wheel-caption { margin: 9px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .side { display: flex; flex-direction: column; gap: 17px; }
    .result-card { position: relative; min-height: 205px; padding: 22px 23px 20px; overflow: hidden; }
    .result-card::after {
      content: "✦"; position: absolute; right: 19px; top: 11px; color: rgba(232, 135, 170, .19);
      font-size: 69px; line-height: 1; transform: rotate(12deg); pointer-events: none;
    }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag { color: #c77f9b; font-size: 10px; font-weight: 900; letter-spacing: .16em; }
    .winner {
      min-height: 74px; display: flex; align-items: center; margin: 10px 0 3px;
      color: #bd6b8d; font-size: clamp(29px, 4vw, 39px); font-weight: 900; letter-spacing: .025em;
      overflow-wrap: anywhere;
    }
    .result-hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .editor-card { padding: 21px 22px 19px; display: flex; flex-direction: column; flex: 1; }
    .editor-intro { margin: 6px 0 13px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .textarea-wrap { position: relative; flex: 1; min-height: 280px; }
    textarea {
      display: block; width: 100%; min-height: 280px; height: 100%; resize: vertical;
      border: 1px solid #f0dce5; border-radius: 16px; padding: 14px 15px;
      outline: none; color: var(--ink); background: rgba(255, 250, 252, .82);
      font-size: 14px; line-height: 1.8; box-shadow: inset 0 2px 5px rgba(145, 101, 123, .035);
    }
    textarea::placeholder { color: #c5b3be; }
    textarea:focus { border-color: #e7a5bd; box-shadow: 0 0 0 4px rgba(232, 135, 170, .11); }
    textarea:disabled { opacity: .7; }
    .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .save-status { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .save-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #89c9ad; }
    .clear-button {
      min-height: 38px; border: 1px solid #ecdde4; border-radius: 11px; padding: 8px 12px;
      color: #9e7789; cursor: pointer; background: rgba(255,255,255,.72); font-size: 12px;
      transition: background .15s ease, border-color .15s ease;
    }
    .clear-button:hover:not(:disabled) { border-color: #e7b5c7; background: #fff3f7; }
    .clear-button:disabled { cursor: default; opacity: .5; }
    .tip {
      margin-top: 13px; padding: 11px 12px; border-radius: 13px; color: #92778a;
      background: #f7eff7; font-size: 11px; line-height: 1.65;
    }
    button:focus-visible { outline: 3px solid #cf83a1; outline-offset: 3px; }
    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .wheel-card { min-height: auto; }
      .wheel-wrap { width: min(100%, 550px); }
      .side { display: grid; grid-template-columns: .9fr 1.1fr; align-items: stretch; }
      .editor-card { min-height: 455px; }
      .result-card { min-height: 0; }
    }
    @media (max-width: 600px) {
      .page { width: min(100% - 22px, 520px); padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: calc(27px + env(safe-area-inset-bottom)); }
      header { align-items: flex-start; margin-bottom: 17px; }
      .brand { gap: 11px; }
      .brand-mark { width: 45px; height: 45px; border-radius: 15px; font-size: 23px; }
      .header-note { max-width: 96px; font-size: 11px; }
      .layout { gap: 14px; }
      .wheel-card { padding: 17px 12px 19px; border-radius: 22px; }
      .wheel-heading { padding: 0 4px; }
      .wheel-heading h2 { font-size: 14px; }
      .count-pill { padding: 6px 9px; font-size: 11px; }
      .wheel-wrap { width: min(100%, 490px); }
      .spin-button { min-width: 88px; border-width: 5px; }
      .pointer { border-left-width: 12px; border-right-width: 12px; border-top-width: 27px; }
      .wheel-caption { font-size: 11px; }
      .side { display: flex; gap: 13px; }
      .result-card, .editor-card { padding: 18px; border-radius: 21px; }
      .result-card { min-height: 165px; }
      .winner { min-height: 57px; margin-top: 6px; font-size: clamp(27px, 8vw, 36px); }
      .textarea-wrap { min-height: 230px; }
      textarea { min-height: 230px; font-size: 16px; }
      .editor-card { min-height: 0; }
      .clear-button { min-height: 42px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✿</div>
        <div><p class="eyebrow">MACARON ROULETTE</p><h1>溫柔漂亮可愛QQ台姐大轉盤</h1></div>
      </div>
      <div class="header-note">選項交給轉盤<br>今天就輕鬆決定吧</div>
    </header>

    <div class="layout">
      <section class="card wheel-card" aria-label="隨機抽選轉盤">
        <div class="wheel-heading">
          <h2>準備好轉動了嗎？</h2>
          <span class="count-pill" id="optionCount">0 個選項</span>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" aria-label="可自訂選項的馬卡龍色轉盤"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button" aria-label="開始轉動轉盤" disabled>
            <strong>開始</strong><span>SPIN</span>
          </button>
        </div>
        <p class="wheel-caption" id="wheelCaption">先在右側加入至少兩個選項</p>
      </section>

      <aside class="side">
        <section class="card result-card" aria-live="polite">
          <div class="section-heading"><h2>轉盤結果</h2><span class="tag">YOUR PICK</span></div>
          <div class="winner" id="winner">等待你的選項</div>
          <p class="result-hint" id="resultHint">每一行都是一個選項。轉盤停下後，結果會顯示在這裡。</p>
        </section>

        <section class="card editor-card">
          <div class="section-heading"><h2>編輯選項</h2><span class="tag">每行一個</span></div>
          <p class="editor-intro">貼上或輸入想抽選的內容，空白行會自動略過。重複的選項會分別計入抽選。</p>
          <div class="textarea-wrap">
            <textarea id="optionsInput" aria-label="轉盤選項，每行一個" placeholder="例如：&#10;喝杯奶茶&#10;休息一下&#10;看一本書" spellcheck="false"></textarea>
          </div>
          <div class="editor-footer">
            <div class="save-status" id="saveStatus"><span class="save-dot" aria-hidden="true"></span><span>自動保存在這台裝置</span></div>
            <button class="clear-button" id="clearButton" type="button" disabled>清空清單</button>
          </div>
          <div class="tip" id="validationHint">輸入至少兩個選項即可開始轉動。清單只保存在目前的瀏覽器，不會同步到其他裝置。</div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "macaron-wheel-options-v1";
      const TAU = Math.PI * 2;
      const colors = ["#f4b5c8", "#f7c897", "#f8dfa0", "#b9ddc4", "#a9d9dc", "#b7c9ed", "#cbb9e8", "#e3b8d4"];
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const input = document.getElementById("optionsInput");
      const spinButton = document.getElementById("spinButton");
      const clearButton = document.getElementById("clearButton");
      const winner = document.getElementById("winner");
      const resultHint = document.getElementById("resultHint");
      const countLabel = document.getElementById("optionCount");
      const wheelCaption = document.getElementById("wheelCaption");
      const validationHint = document.getElementById("validationHint");
      const saveStatus = document.getElementById("saveStatus");
      let entries = [];
      let rotation = 0;
      let spinning = false;
      let animationFrame = 0;

      try {
        input.value = localStorage.getItem(STORAGE_KEY) || "";
      } catch (error) {
        saveStatus.lastElementChild.textContent = "瀏覽器未允許本機保存";
      }

      function normalize(angle) {
        return ((angle % TAU) + TAU) % TAU;
      }

      function parseEntries(value) {
        return value.split(/\r?\n/).map((entry) => entry.trim()).filter(Boolean);
      }

      function drawWheel() {
        const size = Math.floor(canvas.getBoundingClientRect().width);
        if (!size) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pixels = Math.round(size * dpr);
        if (canvas.width !== pixels || canvas.height !== pixels) {
          canvas.width = pixels;
          canvas.height = pixels;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, size, size);

        const center = size / 2;
        const radius = size * .465;
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(rotation);

        if (entries.length) {
          const step = TAU / entries.length;
          for (let i = 0; i < entries.length; i++) {
            const start = -Math.PI / 2 + i * step;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, start, start + step);
            ctx.closePath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,.82)";
            ctx.lineWidth = Math.max(1, size * .003);
            ctx.stroke();

            if (entries.length <= 24) {
              const middle = start + step / 2;
              const screenAngle = normalize(middle + rotation);
              ctx.save();
              ctx.rotate(middle);
              ctx.translate(radius * .73, 0);
              if (screenAngle > Math.PI / 2 && screenAngle < Math.PI * 1.5) ctx.rotate(Math.PI);
              const sizeScale = Math.max(.58, 1 - Math.max(0, entries.length - 10) * .035);
              const fontSize = Math.max(9, Math.min(16, size * .035) * sizeScale);
              ctx.fillStyle = "#574552";
              ctx.font = "700 " + fontSize + "px system-ui, sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(entries[i], 0, 0, radius * .58);
              ctx.restore();
            }
          }
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.fillStyle = "#f9edf2";
          ctx.fill();
          ctx.setLineDash([size * .018, size * .018]);
          ctx.strokeStyle = "#e9c8d5";
          ctx.lineWidth = size * .012;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = "#ae91a0";
          ctx.font = "700 " + Math.max(13, size * .035) + "px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("先加入選項", 0, 0);
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(center, center, radius + size * .012, 0, TAU);
        ctx.strokeStyle = "rgba(255,255,255,.95)";
        ctx.lineWidth = size * .022;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(center, center, radius + size * .027, 0, TAU);
        ctx.strokeStyle = "rgba(213,145,174,.25)";
        ctx.lineWidth = size * .008;
        ctx.stroke();

        for (let i = 0; i < 32; i++) {
          const angle = i * TAU / 32 - Math.PI / 2;
          const dotRadius = radius + size * .027;
          ctx.beginPath();
          ctx.arc(center + Math.cos(angle) * dotRadius, center + Math.sin(angle) * dotRadius, Math.max(1.7, size * .006), 0, TAU);
          ctx.fillStyle = i % 4 === 0 ? "#fff" : "#edc4d2";
          ctx.fill();
        }
      }

      function updateOptions() {
        entries = parseEntries(input.value);
        countLabel.textContent = entries.length + (entries.length === 1 ? " 個選項" : " 個選項");
        spinButton.disabled = spinning || entries.length < 2;
        clearButton.disabled = spinning || input.value.length === 0;
        if (entries.length < 2) {
          wheelCaption.textContent = entries.length === 0 ? "先在下方加入至少兩個選項" : "再加入一個選項就可以開始";
          validationHint.textContent = "輸入至少兩個選項即可開始轉動。清單只保存在目前的瀏覽器，不會同步到其他裝置。";
        } else if (entries.length > 24) {
          wheelCaption.textContent = "已加入 " + entries.length + " 個選項 · 名稱過多時以轉盤顏色抽選";
          validationHint.textContent = "每個選項機率相同。選項超過 24 個時，轉盤會隱藏扇形文字，抽選結果仍會清楚顯示。";
        } else {
          wheelCaption.textContent = "已加入 " + entries.length + " 個選項 · 每個選項機率相同";
          validationHint.textContent = "清單只保存在目前的瀏覽器，不會同步到其他裝置。每一行都是獨立選項。";
        }
        try {
          localStorage.setItem(STORAGE_KEY, input.value);
          if (saveStatus.lastElementChild.textContent !== "瀏覽器未允許本機保存") {
            saveStatus.lastElementChild.textContent = "自動保存在這台裝置";
          }
        } catch (error) {
          saveStatus.lastElementChild.textContent = "本機保存空間不可用";
        }
        drawWheel();
      }

      function finishSpin(name) {
        winner.textContent = name;
        resultHint.textContent = "這次就選它吧！選項保留在清單中，可以再轉一次。";
        spinning = false;
        input.disabled = false;
        clearButton.disabled = input.value.length === 0;
        spinButton.disabled = entries.length < 2;
      }

      function spin() {
        if (spinning || entries.length < 2) return;
        const spinEntries = entries.slice();
        const selectedIndex = Math.floor(Math.random() * spinEntries.length);
        const step = TAU / spinEntries.length;
        const targetRotation = -((selectedIndex + .5) * step);
        const delta = 8 * TAU + normalize(targetRotation - normalize(rotation));
        const startRotation = rotation;
        const startTime = performance.now();
        const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 700 : 5000;

        spinning = true;
        input.disabled = true;
        clearButton.disabled = true;
        spinButton.disabled = true;
        resultHint.textContent = "轉盤正在旋轉，看看命運會選中哪一項…";

        function frame(now) {
          const progress = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - progress, 4);
          rotation = startRotation + delta * eased;
          drawWheel();
          if (progress < 1) {
            animationFrame = requestAnimationFrame(frame);
          } else {
            rotation = normalize(startRotation + delta);
            drawWheel();
            finishSpin(spinEntries[selectedIndex]);
          }
        }
        animationFrame = requestAnimationFrame(frame);
      }

      input.addEventListener("input", updateOptions);
      spinButton.addEventListener("click", spin);
      clearButton.addEventListener("click", () => {
        if (spinning) return;
        input.value = "";
        winner.textContent = "等待你的選項";
        resultHint.textContent = "每一行都是一個選項。轉盤停下後，結果會顯示在這裡。";
        updateOptions();
        input.focus();
      });
      window.addEventListener("resize", drawWheel);
      if ("ResizeObserver" in window) {
        new ResizeObserver(drawWheel).observe(canvas);
      }
      updateOptions();
    })();
  </script>
</body>
</html>
